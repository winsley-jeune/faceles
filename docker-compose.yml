services:
  trendscraper:
    build:
      context: ./trendscraper
    ports:                      # <--- ADD THIS SECTION
      - "3000:3000"             # <--- Maps localhost:3000 -> Container:3000
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - LOCALE=${LOCALE}
      - COQUI_SPEAKER_ID=${COQUI_SPEAKER_ID}
    volumes:
      - ./videos:/app/videos
      - ./trendscraper/src/modules:/app/modules
      - ./trendscraper/src/index.js:/app/index.js